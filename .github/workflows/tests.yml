name: Tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:
  schedule:
    # Every Monday at 00:23 UTC (09:23 JST)
    - cron: "23 0 * * 1"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests offline
        run: python -m pytest -q
      - name: Evaluate sample ranking
        shell: bash
        run: |
          python scripts/evaluate_retrieval.py --input evaluation/example.jsonl --k 3 | tee retrieval-results.txt
          {
            echo '## Sample retrieval evaluation'
            echo ''
            echo 'Offline example only; not a production-quality accuracy estimate.'
            echo ''
            echo '~~~text'
            cat retrieval-results.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
